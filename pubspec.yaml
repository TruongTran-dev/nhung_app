name: expensive_management
description: "Nhung project"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: '>=2.18.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.2

  permission_handler: ^11.3.1

  shared_preferences: ^2.0.15
  # flutter_secure_storage: ^9.2.4
  
  # Flutter packages for checking network connectivity status
  connectivity_plus: ^6.1.3
  
  mat_month_picker_dialog: ^1.1.1
  currency_picker: ^2.0.13

  syncfusion_flutter_charts: ^29.1.35
  flutter_datetime_picker_plus: ^2.1.0

  flutter_switch: ^0.3.2
  
  #
  path_provider: ^2.0.15
  open_file: ^3.1.0

  # Firebase packages
  firebase_messaging: ^15.1.0
  firebase_core: ^3.8.0
  firebase_storage: ^12.4.2

  # package for state management
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0

#  awesome_notifications: ^0.7.5
#  awesome_notifications_fcm: ^0.7.5

  image_picker: ^1.1.2
  cached_network_image: ^3.2.3
  share_plus: ^10.1.4
  url_launcher: ^6.1.6

  # package for making HTTP requests
  dio: ^5.0.1
  http: any

  change_app_package_name: ^1.4.0

  csv: ^6.0.0
  excel: ^4.0.6

  #Error handler library for type-safe and easy work with errors on Dart and Flutter
  either_dart: ^1.0.0

  equatable: ^2.0.7

  # flutter package to generate code for assets, fonts, colors, etc.
  flutter_gen: ^5.10.0
  get_it: ^8.0.3

  # flutter package for easy and efficient navigation and routing
  go_router: ^14.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_gen_runner:

flutter_gen:
  output: lib/src/shared/resources
  line_length: 300
  integrations:
    flutter_svg: false

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/

  # To add assets to your application, add an assets section, like this:
  # assets:
